apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp.fullname" . }}-config
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.service.port | quote }}
  BACKEND_API_URL: {{ .Values.config.backendApiUrl | quote }}
  CRAWLER_API_URL: {{ .Values.config.crawlerApiUrl | quote }}
  THUNDER_BASE_URL: {{ .Values.config.thunderBaseUrl | quote }}
  THUNDER_ISSUER: {{ .Values.config.thunderIssuer | quote }}
  THUNDER_INSECURE_TLS: {{ .Values.config.thunderInsecureTls | quote }}
  MCP_PUBLIC_BASE_URL: {{ .Values.config.mcpPublicBaseUrl | quote }}
  MCP_RESOURCE_ID: {{ .Values.config.mcpResourceId | quote }}
